<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Animated preview of Compass Ed version 2.4: motion, the campus home inside both portals, Compass Ed and ECA naming">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#000"/><stop offset=".55" stop-color="#06161a"/><stop offset="1" stop-color="#0b2a30"/></linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4cc4cf"/><stop offset="1" stop-color="#1b8e99"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#4cc4cf" stop-opacity=".55"/><stop offset="1" stop-color="#4cc4cf" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="64" height="64" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="2.2" fill="#4cc4cf" opacity=".28"/></pattern>
    <style>
      .t{font-family:Manrope,"Plus Jakarta Sans",Arial,sans-serif;font-weight:800;fill:#fff}
      .b{font-family:"Plus Jakarta Sans",Arial,sans-serif;font-weight:500;fill:#d5dcde;font-size:28px}
      .m{font-family:"JetBrains Mono",Menlo,monospace;font-weight:500}
      .up{opacity:0;transform:translateY(26px);animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}.d5{animation-delay:1.1s}.d6{animation-delay:1.35s}.d7{animation-delay:1.6s}.d8{animation-delay:1.85s}.d9{animation-delay:2.1s}
      @keyframes up{to{opacity:1;transform:none}}
      .spin{transform-origin:1290px 620px;animation:spin 28s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .breathe{transform-origin:1290px 620px;animation:br 4s ease-in-out infinite}
      @keyframes br{50%{transform:scale(1.04)}}
      .float{animation:fl 3.2s ease-in-out infinite}
      @keyframes fl{50%{transform:translateY(-14px)}}
      .glowp{animation:gl 5s ease-in-out infinite}
      @keyframes gl{50%{opacity:.6}}
      .sweep{stroke-dasharray:420;stroke-dashoffset:420;animation:sw 1.2s .9s cubic-bezier(.2,.7,.2,1) forwards}
      @keyframes sw{to{stroke-dashoffset:0}}
      .card{opacity:0;transform:translateX(40px);animation:card .8s cubic-bezier(.2,.7,.2,1) forwards}
      .c1{animation-delay:1.2s}.c2{animation-delay:1.45s}.c3{animation-delay:1.7s}
      @keyframes card{to{opacity:1;transform:none}}
      .cursor{animation:cur 2.6s ease-in-out infinite}
      @keyframes cur{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,70px)}}
      .press{animation:pr 2.6s ease-in-out infinite}
      @keyframes pr{0%,40%,100%{fill:#111}55%{fill:#4cc4cf}}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle class="glowp" cx="1290" cy="620" r="420" fill="url(#glow)"/>

  <!-- brand row -->
  <g class="up d1">
    <g transform="translate(100 90)">
      <path d="M28 4 14 10v10c0 9 6 16 14 20 8-4 14-11 14-20V10z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <path d="m20 22 5 5 9-9" fill="none" stroke="#4cc4cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="t" x="160" y="128" font-size="40">Compass <tspan fill="#4cc4cf">Ed</tspan></text>
    <rect x="350" y="94" width="150" height="46" rx="23" fill="#4cc4cf"/>
    <text class="m" x="425" y="126" font-size="24" fill="#000" text-anchor="middle">v2.4</text>
  </g>

  <!-- headline with underline sweep -->
  <text class="t up d2" x="100" y="300" font-size="92">Motion, in</text>
  <text class="t up d3" x="100" y="400" font-size="92">every corner.</text>
  <path class="sweep" d="M100 430 H520" stroke="url(#cy)" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- feature list -->
  <g class="b">
    <text class="up d4" x="100" y="520">• The campus home page inside both portals, without signing out</text>
    <text class="up d5" x="100" y="568">• "Welcome to campus" entrance and reveal-on-scroll motion</text>
    <text class="up d6" x="100" y="616">• Hover lifts, pressed buttons, smoother transitions everywhere</text>
    <text class="up d7" x="100" y="664">• Ambient hero and sign-in loops designed in Moda</text>
    <text class="up d8" x="100" y="712">• "Compass Ed" naming, ECA clubs, tighter layouts</text>
  </g>
  <g class="up d9">
    <circle cx="112" cy="880" r="11" fill="#e5484d"/><circle cx="146" cy="880" r="11" fill="#30a46c"/><circle cx="180" cy="880" r="11" fill="#3e63dd"/><circle cx="214" cy="880" r="11" fill="#f5c518"/>
    <text class="b" x="244" y="889" font-size="22" fill="#fff">28 October 2026 · compass-ed.github.io</text>
  </g>

  <!-- rings + play -->
  <g class="breathe"><circle cx="1290" cy="620" r="190" fill="none" stroke="#4cc4cf" stroke-width="22" opacity=".9"/></g>
  <g class="spin"><circle cx="1290" cy="620" r="124" fill="none" stroke="#fff" stroke-width="7" opacity=".5" stroke-dasharray="40 26"/></g>
  <g class="float"><polygon points="1262,575 1262,665 1340,620" fill="#fff"/></g>

  <!-- mini portal cards sliding in -->
  <g class="card c1"><rect x="1080" y="150" width="260" height="70" rx="16" fill="#111" stroke="#2a2a2a"/><rect x="1100" y="172" width="26" height="26" rx="7" fill="#4cc4cf"/><rect x="1140" y="176" width="150" height="8" rx="4" fill="#fff" opacity=".9"/><rect x="1140" y="194" width="100" height="6" rx="3" fill="#9aa6a9"/></g>
  <g class="card c2"><rect x="1120" y="240" width="260" height="70" rx="16" fill="#111" stroke="#2a2a2a"/><rect x="1140" y="262" width="26" height="26" rx="7" fill="#f5c518"/><rect x="1180" y="266" width="140" height="8" rx="4" fill="#fff" opacity=".9"/><rect x="1180" y="284" width="90" height="6" rx="3" fill="#9aa6a9"/></g>
  <g class="card c3"><rect class="press" x="1160" y="330" width="260" height="70" rx="16" stroke="#2a2a2a"/><rect x="1180" y="352" width="26" height="26" rx="7" fill="#30a46c"/><rect x="1220" y="356" width="160" height="8" rx="4" fill="#fff" opacity=".9"/><rect x="1220" y="374" width="80" height="6" rx="3" fill="#9aa6a9"/></g>
  <g class="cursor"><path d="M1180 300 l0 34 l9-8 l7 16 l8-4 l-7-15 l12-1z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/></g>
</svg>
