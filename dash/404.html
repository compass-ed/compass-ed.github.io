<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Page not found · Compass Dash</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#d9dee7;--tx:#17202e;--mut:#4f5a6b;--acc:#1d4ed8;--on:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f141c;--card:#171e29;--line:#2a3342;--tx:#e7ecf3;--mut:#a9b4c5;--acc:#8ab8ff;--on:#06101f;color-scheme:dark}}
*{box-sizing:border-box}html{font-size:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--tx);font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;text-align:center}
.code{font-size:4.5rem;font-weight:800;line-height:1;margin:0 0 8px;color:var(--acc);letter-spacing:-.02em}
h1{font-size:1.6rem;margin:0 0 8px}p{margin:0 0 14px}.mut{color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0 18px}
a{color:var(--acc)}.btn{display:inline-block;padding:11px 18px;border-radius:10px;border:2px solid var(--acc);font-weight:600;text-decoration:none}
.btn.p{background:var(--acc);color:var(--on)}.btn:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.cube{width:56px;height:56px;margin:0 auto 16px;border-radius:12px;background:var(--acc);position:relative}
.cube::before,.cube::after{content:"";position:absolute;top:18px;width:9px;height:12px;border-radius:2px;background:var(--on)}.cube::before{left:13px}.cube::after{right:13px}
footer{margin-top:6px;font-size:.9rem}
</style></head><body>
<main>
<div class="cube" aria-hidden="true"></div>
<p class="code" aria-hidden="true">404</p>
<h1>Page not found</h1>
<p>We could not find that page. It may have moved, or the link may have a typo.</p>
<div class="row"><a class="btn p" href="/Compassdash/">Go to Compass Dash</a></div>
<p class="mut">Need help? Email <a href="mailto:compassdashedu@gmail.com?subject=Page%20not%20found">compassdashedu@gmail.com</a></p>
<footer class="mut"><a href="/Compassdash/#/privacy">Privacy Policy</a> · <a href="/Compassdash/#/terms">Terms of Service</a> · <a href="/Compassdash/#/cookies">Cookie Policy</a></footer>
</main>
</body></html>
