<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://eqaxgofniwyhvwmdzwsm.supabase.co; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; form-action 'self'; object-src 'none'; base-uri 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Staff portal · Compass Ed</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&family=JetBrains+Mono:wght@500&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .side.teach{background:#fff;color:var(--ink);border-right:1px solid var(--line)}
  .side.teach .brand{color:var(--ink)} .side.teach .brand b{color:var(--cyan3)}
  .side.teach a.nl{color:var(--ink2)} .side.teach a.nl:hover{background:var(--bg3);color:var(--ink)} .side.teach a.nl.on{background:var(--ink);color:#fff}
  .side.teach a.nl .n{background:var(--cyan);color:#000} .side.teach .me{background:var(--bg2)} .side.teach .me .nm{color:var(--ink)} .side.teach .me .av{background:var(--ink);color:#fff}
  .side.teach .sec-l{color:var(--mute)}
  .topbar.teach{background:var(--ink);color:#fff;border-color:#000} .topbar.teach .ib{color:#fff} .topbar.teach .ib:hover{background:#222}
  body{background:var(--bg2)}
</style>
</head>
<body>
<div class="shell">
  <aside class="side teach" id="side">
    <a class="brand" href="#/"><img src="../assets/logo-white.svg" alt="">Compass <b>Ed</b></a>
    <a class="nl" href="#/"><span data-icon="home"></span>Dashboard</a>
    <a class="nl" href="#/campus"><span data-icon="campus"></span>Campus home</a>
    <a class="nl" href="#/activities"><span data-icon="explore"></span>Content</a>
    <a class="nl" href="#/classes"><span data-icon="users"></span>Classes</a>
    <a class="nl" href="#/assignments"><span data-icon="pencil"></span>Assignments <span class="n hide" id="nGrade"></span></a>
    <a class="nl" href="#/content"><span data-icon="puzzle"></span>Teaching</a>
    <a class="nl" href="#/announcements"><span data-icon="megaphone"></span>Notices</a>
    <a class="nl" href="#/people"><span data-icon="people"></span>People</a>
    <a class="nl hide" id="navAdmin" href="#/admin"><span data-icon="shield"></span>Admin</a>
    <a class="nl" href="#/settings"><span data-icon="settings"></span>Settings</a>
    <div class="sp"></div>
    <div class="me"><div class="av" id="meAv">?</div><div><div class="nm" id="meName">…</div><div class="rl" id="meRole"></div></div><button class="ib right" id="signout" title="Sign out" aria-label="Sign out"><span data-icon="exit"></span></button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="topbar teach">
      <button class="ib burger" data-burger aria-label="Menu"><span data-icon="menu"></span></button>
      <h2 id="ptitle">Dashboard</h2>
      <span class="badge" style="background:#222;color:#fff">Staff portal</span>
      <a class="ib" href="#/search" aria-label="Search" style="margin-left:auto"><span data-icon="explore"></span></a>
      <div class="bell" id="bellWrap"><button class="ib" id="bell" aria-label="Notifications"><span data-icon="bell"></span><span class="n hide" id="bellN"></span></button><div class="pop" id="bellPop" style="color:var(--ink)"></div></div>
    </div>
    <div class="subnav hide" id="subnav"></div>
    <main class="page" id="page"></main>
  </div>
</div>
<script src="../assets/config.js"></script>
<script src="../assets/core.js"></script>
<script src="../assets/icons.js"></script>
<script src="../assets/demo.js"></script>
<script src="../assets/campus.js"></script>
<script src="../assets/teacher.js"></script>
</body>
</html>
